<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Browser - Vibecraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Asset Browser</h1>
            <span class="subtitle">Seleciona cada asset que o jogo usa</span>
        </div>
        <div class="stats">
            <span id="stat-total">-</span>
            <span id="stat-selected">-</span>
            <span id="stat-audio">-</span>
        </div>
        <div class="actions">
            <button id="btn-cleanup" class="btn btn-ghost" title="Remove arquivos aplicados">Desaplicar</button>
            <button id="btn-apply" class="btn btn-primary">Aplicar no jogo</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Packs</h2>
            <div id="pack-list" class="pack-list"></div>
        </aside>

        <main class="content">
            <div class="toolbar">
                <input id="search" type="text" placeholder="Buscar asset..." autocomplete="off">
                <select id="type-filter">
                    <option value="">Todos os tipos</option>
                    <option value="image">Imagens</option>
                    <option value="audio">Áudio</option>
                    <option value="map">Mapas</option>
                    <option value="font">Fontes</option>
                    <option value="data">Dados</option>
                </select>
                <button id="btn-select-visible" class="btn btn-ghost">Selecionar visíveis</button>
                <button id="btn-clear-visible" class="btn btn-ghost">Desmarcar visíveis</button>
                <span id="result-count" class="result-count"></span>
            </div>

            <div id="grid" class="grid"></div>

            <div class="pagination">
                <button id="btn-prev" class="btn btn-ghost">Anterior</button>
                <span id="page-info">-</span>
                <button id="btn-next" class="btn btn-ghost">Próxima</button>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
